name: update profile cards

on:
  schedule:
    - cron: "17 15 * * *" # 매일 00:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_cards.py
      - assets/ascii.json
      - assets/logos/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build terminal & project cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_cards.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          git push
