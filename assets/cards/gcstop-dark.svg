<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="220" viewBox="0 0 440 220" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="광클스탑">
<style>
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.ln,.chip,.fx{opacity:0;animation:fadeUp .5s ease-out forwards}
.cell{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out forwards}
.hot{animation:pop .45s ease-out forwards,glow 2.4s ease-in-out infinite}
.cursor{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.ln,.chip,.fx,.cell,.hot{animation:none;opacity:1}.cursor{animation:none}}
</style>
<defs><clipPath id="lc"><rect x="22" y="22" width="52" height="52" rx="12"/></clipPath><linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="220"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset="0.45" stop-color="#58a6ff" stop-opacity="0"/><stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.9"/><stop offset="0.55" stop-color="#58a6ff" stop-opacity="0"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-440 -220;440 220" dur="5s" begin="1.50s" repeatCount="indefinite"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="439" height="219" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect x="0.75" y="0.75" width="438.5" height="218.5" rx="14" fill="none" stroke="url(#sweep)" stroke-width="1.5"/>
<g class="fx" style="animation-delay:0.00s">
<rect x="22" y="22" width="52" height="52" rx="12" fill="#ffffff"/>
<image x="22" y="22" width="52" height="52" clip-path="url(#lc)" href="data:image/jpeg;base64," xlink:href="data:image/jpeg;base64," preserveAspectRatio="xMidYMid slice"/>
<rect x="22" y="22" width="52" height="52" rx="12" fill="none" stroke="#30363d"/>
<text x="90" y="44" font-size="19" font-weight="700" fill="#ffffff">광클스탑</text>
<text x="90" y="66" font-size="12.5" fill="#7d8590">gcstop.co.kr  ·  2026.10 – 현재 · Frontend</text>
<text x="22" y="102" font-size="13.5" fill="#e6edf3">전국 대학 실제 화면을 재현한 수강신청 연습 서비스. 정각</text>
<text x="22" y="123" font-size="13.5" fill="#e6edf3">타이밍 연습과 실시간 선착순 배틀까지.</text>
</g>
<g class="chip" style="animation-delay:0.45s"><rect x="22" y="150" width="96" height="24" rx="12" fill="#132344"/><text x="70" y="166.5" font-size="12" font-weight="600" text-anchor="middle" fill="#93c5fd">26개 대학 UI</text></g>
<g class="chip" style="animation-delay:0.60s"><rect x="126.32000000000001" y="150" width="87" height="24" rx="12" fill="#132344"/><text x="170" y="166.5" font-size="12" font-weight="600" text-anchor="middle" fill="#93c5fd">실시간 배틀</text></g>
<g class="chip" style="animation-delay:0.75s"><rect x="221.04000000000002" y="150" width="99" height="24" rx="12" fill="#132344"/><text x="270" y="166.5" font-size="12" font-weight="600" text-anchor="middle" fill="#93c5fd">서버시간 측정</text></g>
<text class="fx" style="animation-delay:0.95s" x="22" y="200" font-size="12" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','D2Coding',monospace" fill="#7d8590">React 19 · TanStack Query · Tailwind · SSE</text>
</svg>
