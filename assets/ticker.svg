      <text x="3000" y="35" fill="#93C5FD" textLength="3000">🏆 SoftBank Hackathon 2026 본선 우수상 · 팀장&#160;&#160;✦&#160;&#160;멀티 클라우드 무중단 이전 · 실패 요청 0&#160;&#160;✦&#160;&#160;프론트 + 인프라 설계까지&#160;&#160;✦&#160;&#160;⚡ VeggieVerse 1차 런칭 전담&#160;&#160;✦&#160;&#160;620+ Commits · 245 PRs&#160;&#160;✦&#160;&#160;Toss Payments 빌링 결제·구독&#160;&#160;✦&#160;&#160;TIME Korea 실사용자 LCP 1.4s&#160;&#160;✦&#160;&#160;SEO 92 → 100&#160;&#160;✦&#160;&#160;광클스탑 26개 대학 UI&#160;&#160;✦&#160;&#160;CartrAIder 창의설계 인기상&#160;&#160;✦&#160;&#160;Unibloom 해커톤 예선 팀장&#160;&#160;✦&#160;&#160;RAG 공지 선별 98.9%&#160;&#160;✦&#160;&#160;</text>
